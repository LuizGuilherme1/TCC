spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tcc}
    username: ${DB_USERNAME:tcc-user}
    password: ${DB_PASSWORD:tcc-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration

server:
  port: ${PORT:8085}

jwt:
  port: ${PORT:8085}
  secret: ${JWT_SECRET:chave-secreta-do-tcc-2026}
  expiration-ms: 3600000

logging:
  level:
    root: INFO
